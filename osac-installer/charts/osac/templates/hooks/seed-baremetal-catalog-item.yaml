{{- if and .Values.bmf.enabled .Values.bmf.systemCatalogItem.enabled .Values.bmf.systemCatalogItem.template }}
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-baremetal-catalog-item
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "40"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "osac.labels" . | nindent 8 }}
    spec:
      serviceAccountName: admin
      initContainers:
      {{- include "osac.waitForFulfillment" . | nindent 6 }}
      containers:
      - name: seed-catalog-item
        image: {{ .Values.cliImage }}
        command:
          - /bin/bash
          - -euo
          - pipefail
          - -c
          - |
            AUTH_TOKEN=$(< /var/run/secrets/kubernetes.io/serviceaccount/token)
            API="https://fulfillment-internal-api:8001/api/private/v1/baremetal_instance_catalog_items"

            create_catalog_item() {
              local name="$1"
              local payload="$2"
              local response="/tmp/bmci-response.json"
              local code

              code=$(curl -skS \
                --connect-timeout 5 \
                --max-time 30 \
                -o "${response}" \
                -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer ${AUTH_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary "${payload}" \
                "${API}")

              case "${code}" in
                2??)
                  echo "Created BareMetalInstanceCatalogItem ${name}."
                  ;;
                409)
                  echo "BareMetalInstanceCatalogItem ${name} already exists, skipping."
                  ;;
                *)
                  echo "ERROR: Failed to create ${name} (HTTP ${code})" >&2
                  cat "${response}" >&2
                  return 1
                  ;;
              esac
            }

            {{- $item := .Values.bmf.systemCatalogItem }}
            # Payload is base64-encoded at render time and decoded here so that
            # free-text fields (e.g. the Markdown "description") containing shell
            # metacharacters ($, `, \) are never reprocessed by bash.
            PAYLOAD=$(printf %s '{{ dict
                  "metadata" (dict "name" $item.name)
                  "title" $item.title
                  "description" $item.description
                  "template" (dict "name" $item.template)
                  "published" $item.published
                  "tenant" $item.tenant
                  "field_definitions" $item.fieldDefinitions
                | toJson | b64enc }}' | base64 -d)
            create_catalog_item {{ $item.name | quote }} "${PAYLOAD}"
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: OnFailure
{{- end }}
