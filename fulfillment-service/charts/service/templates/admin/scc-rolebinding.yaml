{{/*
osac-installer's hook Jobs that run as this ServiceAccount (create-hub,
create-network-class, register-local-storage, seed-cluster-versions) pin
runAsUser/fsGroup to a fixed non-root UID, because their image
(quay.io/openshift/origin-cli) has no non-root USER of its own. On OpenShift,
restricted-v2 SCC only allows UIDs from the namespace-allocated range, so this
grants exactly the `anyuid` SCC's `use` permission -- not cluster-admin -- so
the fixed UID is permitted without granting broader cluster access. No-op on
non-OpenShift clusters (Kind), which have no SCC admission at all.
*/}}
{{- if .Capabilities.APIVersions.Has "security.openshift.io/v1" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ .Release.Namespace }}
  name: admin-anyuid-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
- kind: ServiceAccount
  name: admin
  namespace: {{ .Release.Namespace }}
{{- end }}
