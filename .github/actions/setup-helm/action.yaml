# One Helm version for every surface that installs it: CI jobs call this action,
# tools/osac-dev/osac-dev-setup.sh and fulfillment-service/scripts/setup-e2e-tools.sh
# read the same file, so bumping .github/helm-version moves all of them together.
# Rendering parity for a new pin is checked per tools/osac-dev/README.md
# ("Helm version") before the file changes.
name: Setup Helm
description: Install the Helm version pinned in .github/helm-version
inputs:
  version:
    description: Helm version to install instead of the pin in .github/helm-version
    required: false
    default: ''
runs:
  using: composite
  steps:
  - id: pin
    shell: bash
    env:
      INPUT_VERSION: ${{ inputs.version }}
      # github.action_path is this action's own directory, so the pin resolves
      # inside the caller's checkout without depending on its working directory.
      PIN_FILE: ${{ github.action_path }}/../../helm-version
    run: |
      set -euo pipefail
      version=${INPUT_VERSION:-}
      if [[ -z ${version} ]]; then
        if [[ ! -r ${PIN_FILE} ]]; then
          echo "::error::cannot read the Helm version pin at ${PIN_FILE}"
          exit 1
        fi
        version=$(tr -d '[:space:]' <"${PIN_FILE}")
      fi
      if [[ -z ${version} ]]; then
        echo "::error::the Helm version pin at ${PIN_FILE} is empty"
        exit 1
      fi
      printf 'Installing Helm %s\n' "${version}"
      printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"
  - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
    with:
      version: ${{ steps.pin.outputs.version }}
