- name: Wait for control plane namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ cluster_infra_namespace }}-{{ cluster_infra_name }}"
  register: cp_ns
  until: cp_ns.resources | length > 0
  retries: 30
  delay: 10

- name: Set skip network flags for CI
  ansible.builtin.set_fact:
    manage_agents_skip_network_detach: true
    manage_agents_skip_network_attach: true

- name: Wait for the operator to bind worker agents to this cluster
  kubernetes.core.k8s_info:
    kind: Agent
    api_version: agent-install.openshift.io/v1beta1
    namespace: "{{ default_agent_namespace }}"
  register: _all_agents
  until: >-
    (_all_agents.resources | default([])
      | selectattr('spec.clusterDeploymentName', 'defined')
      | selectattr('spec.clusterDeploymentName.name', 'equalto', cluster_infra_name)
      | list | length) >= (cluster_infra_node_requests | map(attribute='numberOfNodes') | map('int') | sum)
  retries: 60
  delay: 10
  when: (cluster_infra_node_requests | map(attribute='numberOfNodes') | map('int') | sum) > 0

- name: Set cluster_infra_network_name
  ansible.builtin.set_fact:
    cluster_infra_network_name: "network-{{ cluster_infra_name }}"
