aap:
  instance:
    enabled: true
    name: "osac-aap"
    controller:
      disabled: false
    eda:
      disabled: true
    hub:
      disabled: true
    lightspeed:
      disabled: true
    redisMode: standalone
    routeTlsTerminationMechanism: Edge
    imagePullPolicy: IfNotPresent

bootstrap:
  enabled: true
  image: ghcr.io/osac-project/osac-aap:latest # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
  cliImage: quay.io/openshift/origin-cli:4.20.0
  backoffLimit: 15
  readinessConsecutiveSuccesses: 3
  # Skip the config-as-code playbook when the inputs the last successful run
  # applied are unchanged (fingerprint in <fullname>-bootstrap-state). The
  # playbook is idempotent but takes minutes, and a post-upgrade hook runs on
  # every helm upgrade. Delete the ConfigMap to force a run.
  skipWhenUnchanged: true

configAsCode:
  manifestSecret: "config-as-code-manifest-ig"
  secret: "config-as-code-ig"
  # Maximum number of add-on operator jobs allowed to run concurrently.
  addonOperatorMaxConcurrentJobs: 50
  eeImage: ""
  # Controller's own execution_environment.pull field (always / missing /
  # never). Left empty by default (config-as-code-secret.yaml omits the env
  # var, Ansible side falls back to "always", preserving today's behavior
  # for the shipped mutable :latest default); e2e sets this to "missing"
  # alongside its own eeImage override, since that image only exists in the
  # node's local store and was never pushed to a real registry.
  eeImagePull: ""
  # Controller project source. Set projectGitUri/projectGitBranch to clone a git
  # repository whose checkout holds the playbooks the job templates name. Set
  # projectArchiveUri instead to fetch a tar or zip archive of that tree, which
  # the controller extracts as the project; it takes precedence over the git
  # settings. The archive lets an environment serve the tree it built instead of
  # tracking a branch, so the project content cannot drift from the playbooks in
  # the execution environment.
  projectGitUri: ""
  projectGitBranch: ""
  projectArchiveUri: ""
  remoteClusterKubeconfigSecretName: ""
  remoteClusterKubeconfigSecretKey: kubeconfig
  manifest:
    create: false
    data: {}
serviceAccounts:
  osacSa: "osac-sa"
  templatePublisher: "template-publisher"

apiToken:
  create: true

instanceGroups:
  clusterFulfillment:
    enabled: false
    config: {}
    secret: {}
  networkFulfillment:
    enabled: false
    config: {}
    secret: {}
  storageFulfillment:
    enabled: false
    config: {}
    secret: {}
  publishTemplates:
    enabled: false
    config:
      OSAC_TEMPLATE_COLLECTIONS: ""
      OSAC_FULFILLMENT_SERVICE_URI: ""
