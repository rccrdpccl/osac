aap:
  instance:
    enabled: true
    name: "osac-aap"
    controller:
      disabled: false
    eda:
      disabled: true
    hub:
      disabled: true
    lightspeed:
      disabled: true
    redisMode: standalone
    routeTlsTerminationMechanism: Edge
    imagePullPolicy: IfNotPresent

bootstrap:
  enabled: true
  image: ghcr.io/osac-project/osac-aap:latest # PLACEHOLDER -- overwritten at release time by osac-build-and-publish.yaml
  cliImage: quay.io/openshift/origin-cli:4.20.0
  backoffLimit: 15
  readinessConsecutiveSuccesses: 3

configAsCode:
  manifestSecret: "config-as-code-manifest-ig"
  secret: "config-as-code-ig"
  # Maximum number of add-on operator jobs allowed to run concurrently.
  addonOperatorMaxConcurrentJobs: 50
  eeImage: ""
  # Controller's own execution_environment.pull field (always / missing /
  # never). Left empty by default (config-as-code-secret.yaml omits the env
  # var, Ansible side falls back to "always", preserving today's behavior
  # for the shipped mutable :latest default); e2e sets this to "missing"
  # alongside its own eeImage override, since that image only exists in the
  # node's local store and was never pushed to a real registry.
  eeImagePull: ""
  projectGitUri: ""
  projectGitBranch: ""
  # Frozen playbook archive: when set, config-as-code creates the Controller
  # project with scm_type: archive (AAP fetches and unpacks a tarball over
  # HTTP) instead of cloning projectGitUri, so playbook content comes from
  # this archive exactly as built -- no git dependency at deploy time.
  projectArchive:
    # External URL of a tar.gz containing the playbooks (e.g. an artifact
    # server). Takes precedence over data when both are set.
    uri: ""
    # base64-encoded tar.gz with the osac-aap/ tree (top-level osac-aap/
    # directory preserved: job template playbook paths are osac-aap/...).
    # When set without uri, the chart serves the tarball from an in-cluster
    # ConfigMap-backed HTTP server and points AAP_PROJECT_ARCHIVE_URI at it.
    data: ""
    # Image used by the in-cluster archive server; must provide python3.12
    # at /usr/bin/python3.12 (the OSAC execution environment does). Defaults
    # to bootstrap.image when empty.
    image: ""
  manifest:
    create: false
    data: {}
serviceAccounts:
  osacSa: "osac-sa"
  templatePublisher: "template-publisher"

apiToken:
  create: true

instanceGroups:
  clusterFulfillment:
    enabled: false
    config: {}
    secret: {}
  networkFulfillment:
    enabled: false
    config: {}
    secret: {}
  storageFulfillment:
    enabled: false
    config: {}
    secret: {}
  publishTemplates:
    enabled: false
    config:
      OSAC_TEMPLATE_COLLECTIONS: ""
      OSAC_FULFILLMENT_SERVICE_URI: ""
